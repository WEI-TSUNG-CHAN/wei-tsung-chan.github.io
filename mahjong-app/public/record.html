<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>戰績查詢 - 胡牌人生</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      line-height: 1.6;
    }
    input, select, button {
      font-size: 1rem;
      margin: 4px 2px;
      padding: 6px 10px;
    }
    #queryResult {
      margin-top: 20px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #f9f9f9;
      white-space: pre-line;
    }
    .thumbnail-section {
      margin-top: 30px;
      padding: 20px;
      border: 2px dashed #bbb;
      border-radius: 8px;
      background: #fff;
    }
    #thumbnailCanvas {
      max-width: 100%;
      height: auto;
      margin-top: 15px;
      border: 1px solid #000;
      display: none;
    }
    .checkbox-label {
      margin-left: 15px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .time-input {
      width: 140px;
    }
  </style>
</head>
<body>
  <h2>戰績查詢系統</h2>

  <p>
    日期：<input type="date" id="datePicker">
    將數：
    <select id="dealerCount">
      <option value="1">第一將</option>
      <option value="2">第二將</option>
      <option value="3">第三將</option>
      <option value="4">第四將</option>
      <option value="5">第五將</option>
      <option value="6">第六將</option>
      <option value="7">第七將</option>
      <option value="8">第八將</option>
    </select>
    <button id="queryBtn">查詢</button>
  </p>

  <div id="queryResult">尚未查詢</div>

  <div class="thumbnail-section">
    <h3>影片封面產製器（YouTube／TikTok）</h3>
    <p>
      大標題 (3~5字)：<input type="text" id="thumbTitle" placeholder="例如：連八拉八！">
      選擇影片背景：<input type="file" id="videoFile" accept="video/*">
    </p>
    <p>
      ⏱️ 指定截圖時間：
      <input type="text" id="seekTime" class="time-input" placeholder="例如 55:06 或秒數">
      <label class="checkbox-label">
        <input type="checkbox" id="showRoundText"> 顯示將數資訊（直播縮圖請取消勾選）
      </label>
    </p>
    <p>
      封面比例：
      <select id="thumbRatio">
        <option value="16:9">16:9（YouTube）</option>
        <option value="9:16">9:16（TikTok／Shorts）</option>
      </select>
      <button id="genThumbBtn">生成封面</button>
      <button id="downloadThumbBtn" style="display:none;">下載封面</button>
    </p>
    <canvas id="thumbnailCanvas" width="1280" height="720"></canvas>
  </div>

  <script>
    let globalPlayers = "";
    let globalDate = "";
    let globalRoundText = "";

    function parseTimeToSeconds(inputStr) {
      inputStr = inputStr.trim();
      if (!inputStr) return null;

      if (inputStr.includes(':')) {
        const parts = inputStr.split(':').map(Number);
        if (parts.some(isNaN)) return NaN;
        if (parts.length === 2) return parts[0] * 60 + parts[1];
        if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
      }

      const num = parseFloat(inputStr);
      return isNaN(num) ? NaN : num;
    }

    document.getElementById('queryBtn').addEventListener('click', () => {
      const selectedDate = document.getElementById('datePicker').value;
      const dealerSelect = document.getElementById('dealerCount');
      const dealerCount = dealerSelect.value;
      globalRoundText = dealerSelect.options[dealerSelect.selectedIndex].text;

      if (!selectedDate) {
        alert("請先選擇日期");
        return;
      }

      fetch(`/stats?date=${selectedDate}&round_number=${dealerCount}`)
        .then(res => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        })
        .then(data => {
          if (Array.isArray(data) && data.length > 0) {
            globalPlayers = data.slice(0, 4).map(record => record.player_name).join(" ");
          } else {
            globalPlayers = "胡牌人生";
          }
          globalDate = selectedDate.replace(/-/g, '.');

          const playerNames = Array.isArray(data)
            ? data.slice(0, 4).map(record => record.player_name).join(",")
            : "";
          let resultText = `${playerNames}\n\n`;
          resultText += "胡牌人生 👉純屬娛樂分享無賭博行為\n\n📅 固定直播時段\nhttps://wei-tsung-chan.github.io/iCalendar/calendar.html\n▶ 每週五、六、日\n▶ 中午或晚上固定開播\n\n本局戰績：\n";

          if (Array.isArray(data) && data.length > 0) {
            data.slice(0, 4).forEach(record => {
              resultText += `🔹 ${record.player_name}：${record.total_score}\n`;
            });
          } else {
            resultText += "暫無資料\n";
          }

          resultText += "\n📌 記得訂閱、按讚，開啟小鈴鐺，不錯過每場刺激對戰！\n#胡牌人生 #麻將 #麻將對戰";
          document.getElementById('queryResult').textContent = resultText;
        })
        .catch(err => {
          console.error("查詢錯誤", err);
          alert("查詢失敗，請稍後再試");
        });
    });

    // 在 16:9 主畫面上繪製原本的玩家、標題與日期資訊。
    function drawOverlay(ctx, titleInput, isShowRound) {
      // 玩家名字
      ctx.save();
      ctx.font = "900 52px system-ui, -apple-system, sans-serif";
      const playersText = ` 👤 ${globalPlayers} `;
      const pWidth = ctx.measureText(playersText).width;
      ctx.fillStyle = "#111111";
      ctx.fillRect(40, 65, pWidth + 20, 70);
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#ffffff";
      ctx.fillText(playersText, 50, 100);
      ctx.restore();

      // 大標題
      if (titleInput) {
        ctx.save();
        ctx.font = "900 110px Arial Black, Impact, sans-serif";
        ctx.textBaseline = "middle";
        const textX = 50;
        const textY = 260;

        ctx.fillStyle = "#000000";
        for (let i = 1; i <= 12; i++) {
          ctx.fillText(titleInput, textX + i, textY + i);
        }
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 24;
        ctx.lineJoin = "round";
        ctx.strokeText(titleInput, textX, textY);
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 6;
        ctx.strokeText(titleInput, textX, textY);

        const gradient = ctx.createLinearGradient(textX, textY - 50, textX, textY + 50);
        gradient.addColorStop(0, "#ffea00");
        gradient.addColorStop(1, "#ff4500");
        ctx.fillStyle = gradient;
        ctx.fillText(titleInput, textX, textY);
        ctx.restore();
      }

      // 日期標籤
      ctx.save();
      ctx.font = "900 48px system-ui, -apple-system, sans-serif";
      const dateText = isShowRound
        ? ` 📅 ${globalDate}  ${globalRoundText} `
        : ` 📅 ${globalDate} `;
      const dWidth = ctx.measureText(dateText).width;
      ctx.fillStyle = "#ff1e27";
      ctx.fillRect(40, 535, dWidth + 20, 65);
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#ffffff";
      ctx.fillText(dateText, 50, 567);
      ctx.restore();
    }

    // 9:16：模糊放大的背景填滿直式畫布，中央完整保留 16:9 原始畫面。
    function drawVerticalBackground(ctx, video, width, height) {
      const videoRatio = video.videoWidth / video.videoHeight;
      const canvasRatio = width / height;
      let sx = 0, sy = 0, sw = video.videoWidth, sh = video.videoHeight;

      if (videoRatio > canvasRatio) {
        sw = video.videoHeight * canvasRatio;
        sx = (video.videoWidth - sw) / 2;
      } else {
        sh = video.videoWidth / canvasRatio;
        sy = (video.videoHeight - sh) / 2;
      }

      ctx.save();
      ctx.filter = "blur(32px)";
      // 稍微放大，避免模糊邊緣露出空白。
      ctx.drawImage(video, sx, sy, sw, sh, -35, -35, width + 70, height + 70);
      ctx.restore();

      // 壓暗背景，讓中央原始畫面更突出。
      ctx.save();
      ctx.fillStyle = "rgba(0, 0, 0, 0.28)";
      ctx.fillRect(0, 0, width, height);
      ctx.restore();
    }

    document.getElementById('genThumbBtn').addEventListener('click', () => {
      const videoInput = document.getElementById('videoFile');
      const canvas = document.getElementById('thumbnailCanvas');
      const ctx = canvas.getContext('2d');
      const titleInput = document.getElementById('thumbTitle').value.trim();
      const seekTimeInput = document.getElementById('seekTime').value;
      const isShowRound = document.getElementById('showRoundText').checked;
      const ratio = document.getElementById('thumbRatio').value;

      if (!globalDate) {
        alert("請先完成上方的「戰績查詢」。");
        return;
      }
      if (!videoInput.files || videoInput.files.length === 0) {
        alert("請選擇一個影片檔案作為背景。");
        return;
      }

      // 依選擇比例設定輸出尺寸。
      if (ratio === "9:16") {
        canvas.width = 1080;
        canvas.height = 1920;
      } else {
        canvas.width = 1280;
        canvas.height = 720;
      }

      const file = videoInput.files[0];
      const videoUrl = URL.createObjectURL(file);
      const video = document.createElement('video');
      video.src = videoUrl;
      video.muted = true;
      video.playsInline = true;
      video.preload = "auto";

      let handled = false;
      const cleanup = () => URL.revokeObjectURL(videoUrl);

      video.addEventListener('error', () => {
        if (handled) return;
        handled = true;
        alert("影片讀取失敗，請確認檔案格式是否支援。");
        cleanup();
      });

      video.addEventListener('loadeddata', () => {
        let targetTime;

        if (seekTimeInput.trim() !== "") {
          targetTime = parseTimeToSeconds(seekTimeInput);
          if (targetTime === null || isNaN(targetTime)) {
            handled = true;
            alert("時間格式輸入錯誤，請輸入如 55:06 或直接輸入秒數");
            cleanup();
            return;
          }
          if (targetTime < 0) targetTime = 0;
          if (targetTime >= video.duration) targetTime = Math.max(0, video.duration - 0.1);
        } else {
          targetTime = Math.random() * (video.duration * 0.8) + (video.duration * 0.1);
        }

        video.currentTime = targetTime;
      });

      video.addEventListener('seeked', () => {
        if (handled) return;
        handled = true;

        if (ratio === "16:9") {
          // 保留原本 16:9 的輸出方式與版面。
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          drawOverlay(ctx, titleInput, isShowRound);
        } else {
          // 先畫滿版模糊背景，再將完整 16:9 畫面置中。
          drawVerticalBackground(ctx, video, canvas.width, canvas.height);

          const mainWidth = canvas.width;
          const mainHeight = mainWidth * (video.videoHeight / video.videoWidth);
          const mainY = (canvas.height - mainHeight) / 2;
          ctx.drawImage(video, 0, mainY, mainWidth, mainHeight);

          // 將原本 1280x720 的資訊排版等比例縮放，疊在中央完整畫面上。
          ctx.save();
          const scale = mainWidth / 1280;
          ctx.translate(0, mainY);
          ctx.scale(scale, scale);
          drawOverlay(ctx, titleInput, isShowRound);
          ctx.restore();
        }

        canvas.style.display = "block";
        document.getElementById('downloadThumbBtn').style.display = "inline-block";
        cleanup();
      });
    });

    document.getElementById('downloadThumbBtn').addEventListener('click', () => {
      const canvas = document.getElementById('thumbnailCanvas');
      const ratio = document.getElementById('thumbRatio').value;
      const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = `thumbnail_${globalDate || 'video'}_${ratio.replace(':', 'x')}.jpg`;
      a.click();
    });
  </script>
</body>
</html>
