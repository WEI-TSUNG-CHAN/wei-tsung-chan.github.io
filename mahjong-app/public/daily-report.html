<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <title>日戰報表</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet" />
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Orbitron', sans-serif;
            color: rgba(220, 230, 240, 0.85);
        }

        /* 🔹 新增：本將標題條 */
        .round-label {
            width: 400px;
            margin: 0 auto 6px auto;
            padding: 6px 12px;
            font-size: 1.4rem;
            background: rgba(15, 18, 25, 0.9);
            color: rgba(120, 200, 255, 0.95);
            letter-spacing: 2px;
            border-radius: 6px;
        }

        table {
            width: 400px;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: rgba(20, 24, 30, 0.88);
            border: 1px solid rgba(100, 100, 100, 0.2);
            border-radius: 8px;
        }

        th,
        td {
            margin: 0 auto 6px auto;
            text-align: center;
            border: 1px solid rgba(80, 80, 80, 0.3);
            font-size: 1.2rem;
            color: rgba(240, 250, 255, 0.92);
        }

        th {
            background-color: rgba(35, 40, 50, 0.95);
            color: rgba(79, 195, 247, 0.95);
            font-weight: 700;
        }

        td:first-child {
            color: gold;
            font-weight: 700;
        }

        h1 {
            display: none;
        }

        tbody {
            display: table-row-group;
        }

        /* 🔹 新增：加減分與箭頭特效樣式 */
        .score-trend {
            font-size: 1.2rem;
            font-weight: bold;
            margin-left: 4px;
            display: inline-block;
            animation: popIn 0.3s ease-out;
        }

        .trend-up {
            color: #FF4444 !important; /* 增加/加分：紅色 */
            text-shadow: 0 0 8px rgba(255, 68, 68, 0.6);
            font-weight: bold;
        }

        .trend-down {
            color: #00E676 !important; /* 減少/減分：綠色 */
            text-shadow: 0 0 8px rgba(0, 230, 118, 0.6);
            font-weight: bold;
        }

        @keyframes popIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            80% {
                transform: scale(1.3);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .flash {
            animation: flashAnim 0.6s ease;
        }

        @keyframes flashAnim {
            0% {
                transform: scale(1.15);
            }
            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <!-- 🔹 新增標示：明確告訴觀眾這是本將 -->
    <div class="round-label" id="round-label">
        本將即時戰報
    </div>

    <table>
        <thead>
            <tr>
                <th>玩家</th>
                <th>本將分數</th>
                <th>自摸</th>
                <th>胡牌</th>
                <th>槍</th>
            </tr>
        </thead>
        <tbody id="report-body">
            <tr>
                <td colspan="5">載入中...</td>
            </tr>
        </tbody>
    </table>

    <script>
        let previousData = [];

        async function fetchDirections() {
            const res = await fetch('/directions/all');
            const data = await res.json();
            const map = {};
            data.forEach(item => map[item.key_name] = item.value_name);
            return map;
        }

        async function fetchStats(date, round_number) {
            const res = await fetch(`/stats?date=${encodeURIComponent(date)}&round_number=${round_number}`);
            return res.json();
        }

        async function renderReport() {
            const dir = await fetchDirections();
            const date = dir['assign_date'];
            const round = dir['round_number'];
            const players = [dir['player1'], dir['player2'], dir['player3'], dir['player4']];
            const stats = await fetchStats(date, round);

            let displayStats;

            if (stats.length > 0) {
                displayStats = stats.map(s => ({
                    player_name: s.player_name,
                    total_score: Number(s.total_score),
                    total_zi: s.total_zi,
                    total_hu: s.total_hu,
                    total_qiang: s.total_qiang
                }));
            } else {
                displayStats = players.map(name => ({
                    player_name: name,
                    total_score: 0,
                    total_zi: 0,
                    total_hu: 0,
                    total_qiang: 0
                }));
            }

            // 🔹 計算局數（total_hu 加總，確保數字型別）
            const totalHu = displayStats.reduce((sum, p) => sum + Number(p.total_hu), 0);

            // 🔹 更新表頭文字
            document.getElementById('round-label').innerHTML =
                `<span style="color:green; font-weight:bold;">即時戰報</span> ｜本將累積局數 <span style="color:red; font-weight:bold;">${totalHu}</span>`;

            // 🔹 更新表格內容
            const tbody = document.getElementById('report-body');
            tbody.innerHTML = displayStats.map((p, i) => {
                const prev = previousData[i];
                
                let scoreDisplayHtml = '';
                let trendHtml = '';

                // 比對分數是否有變化
                if (prev && prev.total_score !== undefined && prev.total_score !== p.total_score) {
                    const diff = p.total_score - prev.total_score;
                    if (diff > 0) {
                        // 加分：顯示 +X（紅色），加號箭頭 ▲
                        scoreDisplayHtml = `<span class="trend-up flash">+${diff}</span>`;
                        trendHtml = `<span class="score-trend trend-up">▲</span>`;
                    } else {
                        // 減分：顯示 -X（綠色），減號箭頭 ▼
                        scoreDisplayHtml = `<span class="trend-down flash">${diff}</span>`;
                        trendHtml = `<span class="score-trend trend-down">▼</span>`;
                    }
                } else {
                    // 無變動：顯示原本的本將總分數
                    scoreDisplayHtml = `${p.total_score}`;
                    trendHtml = '';
                }

                // 其他欄位（自摸、胡牌、槍）若有變動時高亮顯示
                const ziChanged = prev && prev.total_zi !== p.total_zi;
                const huChanged = prev && prev.total_hu !== p.total_hu;
                const qiangChanged = prev && prev.total_qiang !== p.total_qiang;

                return `
            <tr>
                <td>${p.player_name}</td>
                <td>${scoreDisplayHtml}${trendHtml}</td>
                <td style="${ziChanged ? 'color:#FFD54F;' : ''}">${p.total_zi}</td>
                <td style="${huChanged ? 'color:#FFD54F;' : ''}">${p.total_hu}</td>
                <td style="${qiangChanged ? 'color:#FFD54F;' : ''}">${p.total_qiang}</td>
            </tr>
        `;
            }).join('');

            previousData = JSON.parse(JSON.stringify(displayStats));
        }

        // 🔹 初始渲染
        renderReport();
        setInterval(renderReport, 5000);
    </script>

</body>

</html>
